[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "al-nebula"
version = "0.1.0"
description = "Modular SPICE evaluation boundary for AutoAnalog-RL"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "torch>=2.2"]
llm = ["anthropic>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["analysis", "rl", "spice"]
