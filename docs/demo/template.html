<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoAnalog-RL</title>
<style>
  :root{
    --paper:#FAFBFD; --card:#FFFFFF; --ink:#0F1C2E; --muted:#5B6B80; --faint:#8494A8;
    --hair:#E3E9F2; --blue:#1A6FE8; --deep:#0A4DA6; --wash:#EEF4FD;
    --ok:#0E7C57; --okwash:#E7F5EF; --bad:#C2453B; --badwash:#FBEDEC;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    --mono:"SF Mono",Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased}

  /* progress + brand */
  #bar{position:fixed;top:0;left:0;height:2px;background:var(--blue);width:0;z-index:50;transition:width .45s ease}
  #brand{position:fixed;top:22px;left:38px;z-index:40;font-size:13px;letter-spacing:.02em}
  #brand b{font-weight:600}
  #brand span{color:var(--faint)}
  #count{position:fixed;top:22px;right:38px;z-index:40;font-size:12px;color:var(--faint);
    font-variant-numeric:tabular-nums}

  /* sections */
  main{height:100%}
  section{position:absolute;inset:0;display:none;padding:76px 38px 92px;overflow:hidden}
  section.on{display:flex;flex-direction:column}
  .wrap{width:100%;max-width:1180px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}
  .wrap.center{justify-content:center}
  .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);
    font-weight:600;margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:400;font-size:64px;line-height:1.05;margin:0 0 18px;letter-spacing:-.02em}
  h2{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.14;margin:0 0 14px;letter-spacing:-.015em}
  .lead{font-size:18px;line-height:1.55;color:var(--muted);max-width:760px;margin:0 0 30px}
  .lead b{color:var(--ink);font-weight:600}
  p{margin:0 0 12px;line-height:1.6}
  .fine{font-size:12.5px;color:var(--faint);line-height:1.55}

  /* fade-in */
  .on .wrap > *{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .on .wrap > *:nth-child(2){animation-delay:.05s}
  .on .wrap > *:nth-child(3){animation-delay:.1s}
  .on .wrap > *:nth-child(4){animation-delay:.15s}
  .on .wrap > *:nth-child(5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* building blocks */
  .grid{display:grid;gap:18px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:20px 22px}
  .card h3{margin:0 0 8px;font-size:15.5px;font-weight:600}
  .card p{font-size:13.5px;color:var(--muted);margin:0}
  .num{font-family:var(--serif);font-size:40px;line-height:1;letter-spacing:-.02em;margin-bottom:6px}
  .num.blue{color:var(--blue)} .num.ok{color:var(--ok)}
  .cap{font-size:12.5px;color:var(--muted);line-height:1.45}

  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--hair)}
  th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:none}
  .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .tag.ok{background:var(--okwash);color:var(--ok)}
  .tag.bad{background:var(--badwash);color:var(--bad)}
  .tag.idle{background:#F1F4F8;color:var(--faint)}

  code,pre{font-family:var(--mono);font-size:12.5px}
  pre{background:#0F1C2E;color:#D7E3F4;border-radius:12px;padding:16px 18px;margin:0;overflow:auto;line-height:1.55}
  pre .c{color:#7FA7D4}
  .kbd{font-family:var(--mono);font-size:11.5px;background:#F1F4F8;border:1px solid var(--hair);
    border-radius:5px;padding:1px 6px}

  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center;
    justify-content:space-between;padding:0 38px;background:linear-gradient(to top,var(--paper) 62%,transparent);z-index:40}
  .dots{display:flex;gap:6px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:#D5DEEA;cursor:pointer;transition:.25s}
  .dot.on{background:var(--blue);transform:scale(1.5)}
  .dot.seen{background:#A9BCD4}
  .navbtns{display:flex;gap:10px;align-items:center}
  button{font-family:inherit;font-size:14px;border-radius:10px;cursor:pointer;border:1px solid var(--hair);
    background:var(--card);color:var(--ink);padding:11px 20px;transition:.18s}
  button:hover{border-color:var(--blue);color:var(--blue)}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary:hover{background:var(--blue);border-color:var(--blue);color:#fff}
  button:disabled{opacity:.35;cursor:default}
  button:disabled:hover{border-color:var(--hair);color:var(--ink)}
  .hint{font-size:11.5px;color:var(--faint);margin-right:6px}

  /* live section */
  .live{display:grid;grid-template-columns:290px 1fr 300px;gap:20px;flex:1;min-height:0}
  .livecol{display:flex;flex-direction:column;min-height:0;gap:12px}
  .knob{font-size:12.5px}
  .knob .r{display:flex;justify-content:space-between;align-items:baseline}
  .knob .nm{color:var(--muted)}
  .knob .v{font-variant-numeric:tabular-nums;font-weight:600}
  .knob .d{font-size:11px;margin-left:6px;color:var(--blue)}
  .track{height:4px;background:#EDF1F7;border-radius:3px;margin-top:5px;position:relative;overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:3px;
    transition:width .55s cubic-bezier(.3,.8,.3,1)}
  .specrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px solid var(--hair);font-size:13px}
  .specrow:last-child{border-bottom:none}
  .specrow .sv{font-variant-numeric:tabular-nums;font-weight:600;margin-right:8px}
  .eyebox{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--card);
    border:1px solid var(--hair);border-radius:14px;padding:14px 16px 10px}
  .eyehead{display:flex;gap:26px;font-size:12.5px;color:var(--faint);flex:0 0 auto}
  .eyehead b{font-variant-numeric:tabular-nums}
  canvas{width:100%;height:100%;display:block}
  .fillbox{flex:1;min-height:0;position:relative}
  .chartbox{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:14px 16px;
    display:flex;flex-direction:column;min-height:0}
  .chartbox h3{margin:0 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .chartbox .body{flex:1;min-height:0}
  .verdict{border:1px solid var(--hair);border-radius:12px;padding:14px 16px;background:var(--card);transition:.3s}
  .verdict.pass{border-color:#B7E3D0;background:var(--okwash)}
  .verdict .big{font-family:var(--serif);font-size:32px;line-height:1}
  .verdict.pass .big{color:var(--ok)}
  .pvt{display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(3,1fr);gap:4px;height:100%}
  .pvt i{border-radius:3px;background:#E6EBF2}
  .pvt i.ok{background:var(--ok);opacity:.85}
  .flow{display:flex;align-items:stretch;gap:0}
  .step{flex:1;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px 16px}
  .step .n{font-family:var(--serif);font-size:22px;color:var(--blue);line-height:1}
  .step h4{margin:6px 0 4px;font-size:14px;font-weight:600}
  .step p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
  .arrow{align-self:center;color:#C3D0E0;padding:0 10px;font-size:18px}
  .rule{height:1px;background:var(--hair);margin:22px 0}
  .quote{font-family:var(--serif);font-size:22px;line-height:1.45;color:var(--ink);max-width:880px}
</style>
</head>
<body>
<div id="bar"></div>
<div id="brand"><b>AutoAnalog-RL</b> <span>· Nebula · AI/ML for Analog Circuit Design</span></div>
<div id="count"></div>

<main id="main"></main>

<nav>
  <div class="dots" id="dots"></div>
  <div class="navbtns">
    <span class="hint">press <span class="kbd">→</span></span>
    <button id="back">Back</button>
    <button class="primary" id="fwd">Next</button>
  </div>
</nav>

<script>
const DATA = /*__DATA__*/ null;
const $ = id => document.getElementById(id);
const NL = String.fromCharCode(10);
const S = DATA.specs;

/* ---------------- section content ---------------- */
const firstOK = DATA.steps.findIndex(s => s.all_specs_met) + 1;
const B = DATA.baselines || {};
const last = DATA.steps[DATA.steps.length - 1];
const lastM = last.metrics;

const SECTIONS = [
{ id:"hero", html:`
  <div class="wrap center">
    <div class="eyebrow">Round 0 · automated analog sizing</div>
    <h1>An agent that sizes a<br>high-speed equalizer.</h1>
    <p class="lead">AutoAnalog-RL sizes a PCIe Gen 2 receiver equalizer — a one-stage CTLE and a one-tap DFE —
      by driving ngspice directly, with no human in the loop. On the real IHP sg13g2 130 nm models it reaches a
      design that passes <b>every specification and all 45 PVT corners</b> in two to three simulations.</p>
    <div class="grid g4" style="max-width:900px">
      <div><div class="num blue">${firstOK}</div><div class="cap">simulations from a random start to a passing design</div></div>
      <div><div class="num">45/45</div><div class="cap">process, voltage and temperature corners</div></div>
      <div><div class="num">5</div><div class="cap">device parameters the agent controls</div></div>
      <div><div class="num">0</div><div class="cap">human interventions</div></div>
    </div>
  </div>`},

{ id:"problem", html:`
  <div class="wrap center">
    <div class="eyebrow">The problem</div>
    <h2>Five knobs, seven specifications,<br>and a simulator in the way.</h2>
    <p class="lead">Every specification is a function of the same five device values, and the function is only
      available through SPICE. Nothing is separable, so a sweep explodes and a generic optimiser spends its budget
      in regions that do not even bias correctly.</p>
    <div class="grid g3">
      <div class="card"><h3>Everything is coupled</h3><p>Widening the input pair raises gain and peaking — and power,
        and input capacitance. Degeneration buys linearity and costs DC gain.</p></div>
      <div class="card"><h3>The spec that matters is hidden</h3><p>The eye opening only exists after a transient
        through a lossy channel. A frequency-domain optimum can still close the eye.</p></div>
      <div class="card"><h3>Evaluation is expensive</h3><p>Each candidate costs three ngspice analyses.
        A blind search spends most of them on designs that fail immediately.</p></div>
    </div>
  </div>`},

{ id:"spec", html:`
  <div class="wrap center">
    <div class="eyebrow">The target</div>
    <h2>The specification the agent is given.</h2>
    <p class="lead">These are the numbers the reward is built from. Our internal eye targets are deliberately
      tighter than the brief's, so the policy delivers margin rather than a marginal pass.</p>
    <div class="grid g2">
      <div class="card" style="padding:6px 8px">
        <table><thead><tr><th>Specification</th><th class="n">Target</th></tr></thead><tbody>
          <tr><td>HF peaking at ${DATA.nyquist_ghz} GHz Nyquist</td><td class="n">${S.peaking_min_db}–${S.peaking_max_db} dB</td></tr>
          <tr><td>Power</td><td class="n">≤ ${(S.power_max_w*1e3).toFixed(0)} mW</td></tr>
          <tr><td>Eye height after channel</td><td class="n">≥ ${S.eye_vertical_min_v} V</td></tr>
          <tr><td>Eye width</td><td class="n">≥ ${S.eye_horizontal_min_ui} UI</td></tr>
          <tr><td>HD3 linearity</td><td class="n">≤ ${S.hd3_max_db} dB</td></tr>
          <tr><td>Input-referred noise</td><td class="n">≤ 1.5 mV rms</td></tr>
          <tr><td>PVT corners</td><td class="n">45 / 45</td></tr>
        </tbody></table>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px;justify-content:center">
        <div class="card"><h3>Signalling</h3><p>NRZ PRBS7 at ${DATA.data_rate_gbps} Gbps, one unit interval
          ${DATA.unit_interval_ps} ps, through a two-section RC channel with ${DATA.channel_loss_db} dB of loss at Nyquist.</p></div>
        <div class="card"><h3>Technology</h3><p>IHP sg13g2 130 nm open PDK, PSP103 transistor models compiled with
          OpenVAF to OSDI and run natively in ngspice — about 0.6 s per agent step with eight simulators in parallel.</p></div>
      </div>
    </div>
  </div>`},

{ id:"circuit", html:`
  <div class="wrap center">
    <div class="eyebrow">The circuit</div>
    <h2>A source-degenerated CTLE.</h2>
    <p class="lead">Degeneration throws away gain at DC and returns it at high frequency: <b>C<sub>s</sub></b> shorts
      <b>R<sub>s</sub></b> as frequency rises, placing a zero near 1/(2·R<sub>s</sub>C<sub>s</sub>) and boosting the
      band the channel attenuated.</p>
    <div class="grid g2" style="align-items:center">
      <div class="card">${schematicSVG()}</div>
      <div class="card" style="padding:6px 8px">
        <table><thead><tr><th>Parameter</th><th class="n">Range</th><th>Raises</th></tr></thead><tbody>
          <tr><td>W<sub>in</sub> input width</td><td class="n">0.5 – 50 µm</td><td class="fine">gain, capacitance</td></tr>
          <tr><td>R<sub>load</sub></td><td class="n">100 – 1000 Ω</td><td class="fine">gain, costs headroom</td></tr>
          <tr><td>I<sub>bias</sub> tail current</td><td class="n">0.1 – 2 mA</td><td class="fine">gain, power, linearity</td></tr>
          <tr><td>R<sub>s</sub> degeneration</td><td class="n">10 – 500 Ω</td><td class="fine">peaking, linearity</td></tr>
          <tr><td>C<sub>s</sub> degeneration</td><td class="n">1 fF – 1 pF</td><td class="fine">moves the zero</td></tr>
          <tr><td>DFE tap <span class="fine">(optional 6th)</span></td><td class="n">−0.5 … +0.5</td><td class="fine">cancels post-cursor ISI</td></tr>
        </tbody></table>
      </div>
    </div>
  </div>`},

{ id:"loop", html:`
  <div class="wrap center">
    <div class="eyebrow">The method</div>
    <h2>A closed loop around the simulator.</h2>
    <p class="lead">The agent proposes a small change to the five values; the evaluator renders the netlist and runs
      the gates in a <b>fail-fast order</b>; the measured metrics become a reward and the next observation.</p>
    <div class="flow">
      <div class="step"><div class="n">01</div><h4>Agent</h4><p>Reads the design and its measured metrics, outputs a step on each knob.</p></div>
      <div class="arrow">→</div>
      <div class="step"><div class="n">02</div><h4>Netlist</h4><p>Normalised action mapped to device values and written into the SPICE deck.</p></div>
      <div class="arrow">→</div>
      <div class="step"><div class="n">03</div><h4>ngspice</h4><p>DC → AC → PRBS transient → HD3, stopping at the first failure.</p></div>
      <div class="arrow">→</div>
      <div class="step"><div class="n">04</div><h4>Reward</h4><p>Normalised spec violations, a power charge, a bonus with margin.</p></div>
    </div>
    <div class="rule"></div>
    <div class="grid g4">
      <div class="card"><h3>1 · <code>.op</code></h3><p>Does it bias? If not: reward −10 and nothing else is simulated.</p></div>
      <div class="card"><h3>2 · <code>.ac</code></h3><p>Peaking at Nyquist minus DC gain, and supply power.</p></div>
      <div class="card"><h3>3 · <code>.tran</code></h3><p>PRBS7 through the channel; eye height and width, DFE tap.</p></div>
      <div class="card"><h3>4 · HD3</h3><p>Single tone; only run once every other specification already passes.</p></div>
    </div>
  </div>`},

{ id:"reward", html:`
  <div class="wrap center">
    <div class="eyebrow">The reward</div>
    <h2>How a circuit measurement<br>becomes a number to maximise.</h2>
    <pre style="max-width:940px"><span class="c">// violation = how far a spec is missed, normalised so 1.0 = a full spec's worth</span>
reward = − Σ wᵢ · violationᵢ  −  w_eff · min(1, P / P_max)
         + [all specs met] · ( 20 + w_margin · min(1, tightest margin) )

<span class="c">// DC operating point failed</span>
reward = −10</pre>
    <div class="grid g3" style="margin-top:22px">
      <div class="card"><h3>A gradient from anywhere</h3><p>The violation sum points toward feasibility even when
        every specification is missed, so the agent always knows which way to move.</p></div>
      <div class="card"><h3>A gradient inside</h3><p>The continuous power charge means two passing designs are not
        equal — the cheaper one scores higher.</p></div>
      <div class="card"><h3>Margin, not the edge</h3><p>The success bonus plus a margin term pulls the design into
        the feasible region instead of onto its boundary.</p></div>
    </div>
  </div>`},

{ id:"agent", html:`
  <div class="wrap center">
    <div class="eyebrow">The agent</div>
    <h2>Soft Actor-Critic, because simulations are expensive.</h2>
    <div class="grid g2" style="align-items:start">
      <div>
        <p class="lead" style="margin-bottom:18px">A critic learns what a move is worth; an actor learns to make
          moves the critic rates highly. Every transition is stored and replayed hundreds of times, so one ngspice
          evaluation trains the networks again and again.</p>
        <div class="grid" style="gap:12px">
          <div class="card"><h3>Observation · 15 numbers</h3><p>5 normalised knob values · DC-valid flag ·
            4 scaled metrics · 5 spec violations. The agent sees how the circuit <em>responded</em>, which is what
            lets one policy work at any corner.</p></div>
          <div class="card"><h3>Action · a step, not a guess</h3><p>Five values in [−1, 1], scaled by 0.2 and added
            to the current design. Incremental moves keep the value function smooth.</p></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
      <div class="chartbox" style="height:190px"><h3>What it learned · feasible steps, smoothed</h3>
        <div class="body fillbox"><canvas id="train"></canvas></div></div>
      <div class="card" style="padding:6px 8px">
        <table><thead><tr><th>Setting</th><th class="n">Value</th></tr></thead><tbody>
          <tr><td>Algorithm</td><td class="n">SAC (stable-baselines3)</td></tr>
          <tr><td>Parallel environments</td><td class="n">8 × ngspice</td></tr>
          <tr><td>Episode</td><td class="n">30 steps, random start</td></tr>
          <tr><td>Held after success</td><td class="n">yes — margin keeps paying</td></tr>
          <tr><td>Batch / gradient steps</td><td class="n">256 / 1 per step</td></tr>
          <tr><td>Entropy coefficient</td><td class="n">auto, from 0.1</td></tr>
          <tr><td>Random warm-up</td><td class="n">500 steps</td></tr>
          <tr><td>Training cost</td><td class="n">≈ 2 h on one machine, once</td></tr>
        </tbody></table>
      </div>
      </div>
    </div>
  </div>`},

{ id:"live", live:true, html:`
  <div class="wrap">
    <div class="eyebrow">Live · a real rollout on the IHP models</div>
    <h2 style="font-size:32px;margin-bottom:6px">Watch it size the circuit.</h2>
    <p class="fine" style="margin-bottom:16px">Random starting design at a random PVT corner
      (<b id="cornerName"></b>). Every number below came out of ngspice. Press <span class="kbd">→</span> to run the next simulation.</p>
    <div class="live">
      <div class="livecol">
        <div class="card" style="padding:14px 16px"><div id="knobs"></div></div>
        <div class="card" style="padding:12px 16px"><div class="cap" id="movecap"></div></div>
        <div class="verdict" id="verdict" style="margin-top:auto">
          <div class="big" id="rewardVal">—</div>
          <div class="cap" id="rewardSub">reward</div>
        </div>
      </div>
      <div class="livecol">
        <div class="eyebox"><div class="eyehead" id="eyenote"></div><div class="fillbox"><canvas id="eye"></canvas></div></div>
      </div>
      <div class="livecol">
        <div class="card" style="padding:12px 16px"><div id="specs"></div></div>
        <div class="chartbox" style="flex:1"><h3 id="miniTitle">AC response</h3><div class="body fillbox"><canvas id="ac"></canvas></div></div>
      </div>
    </div>
  </div>`},

{ id:"results", html:`
  <div class="wrap center">
    <div class="eyebrow">Results</div>
    <h2>Seven runs on the real models.</h2>
    <p class="lead">Every policy design passes peaking, power, eye height and width, HD3, noise and all 45 corners.
      Three seeds of the base configuration agree to within a few percent.</p>
    <div class="card" style="padding:6px 8px">
      <table><thead><tr><th>Run</th><th>Variant</th><th class="n">Rollouts feasible</th><th class="n">Simulations to feasible</th><th>Best design</th></tr></thead><tbody>
        <tr><td>seed 1 · 2 · 3</td><td class="fine">base configuration</td><td class="n">60 / 60</td><td class="n">2 – 3</td><td class="fine">0.32–0.35 V · 1.2 mW · 45/45</td></tr>
        <tr><td>hd3</td><td class="fine">HD3 enforced in the reward</td><td class="n">20 / 20</td><td class="n">2.5</td><td class="fine">0.335 V · 1.24 mW · −58 dB</td></tr>
        <tr><td>pvt</td><td class="fine">curriculum across 45 corners</td><td class="n">24 / 24</td><td class="n">2</td><td class="fine">0.370 V · 1.12 mW · −61.9 dB</td></tr>
        <tr><td>equalizer</td><td class="fine">CTLE + DFE tap in the action</td><td class="n">20 / 20</td><td class="n">3</td><td class="fine">0.355 V post-DFE · 45/45</td></tr>
        <tr><td>gen1</td><td class="fine">retuned to 1.25 GHz Nyquist</td><td class="n">20 / 20</td><td class="n">2</td><td class="fine">5.23 dB @ 1.25 GHz · 45/45</td></tr>
      </tbody></table>

/* ---------------- live rendering ---------------- */
const FMT = {
  W_in: v => (v*1e6).toFixed(2)+" µm", R_load: v => v.toFixed(0)+" Ω",
  I_bias: v => (v*1e3).toFixed(3)+" mA", R_s: v => v.toFixed(0)+" Ω",
  C_s: v => (v*1e15).toFixed(0)+" fF", dfe_tap: v => v.toFixed(3),
};
const LABEL = {W_in:"W_in", R_load:"R_load", I_bias:"I_bias", R_s:"R_s", C_s:"C_s", dfe_tap:"DFE tap"};

function ctxFor(id){
  const c = $(id); if (!c) return null;
  const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
  if (r.width < 8 || r.height < 8) return null;
  c.width = r.width*dpr; c.height = r.height*dpr;
  const x = c.getContext("2d"); x.scale(dpr, dpr); x.clearRect(0,0,r.width,r.height);
  return [x, r.width, r.height];
}
function frame(x,w,h,pad){ x.strokeStyle="#E3E9F2"; x.lineWidth=1; x.strokeRect(pad.l,pad.t,w-pad.l-pad.r,h-pad.t-pad.b); }

function renderKnobs(step, prev){
  $("knobs").innerHTML = Object.keys(step.parameters).map(n => {
    const [lo,hi] = DATA.bounds[n] || [-0.5,0.5], v = step.parameters[n];
    const pct = Math.max(0, Math.min(100, (v-lo)/(hi-lo)*100));
    let d = "";
    if (prev){ const diff = v - prev.parameters[n];
      if (Math.abs(diff) > Math.abs(v)*1e-4) d = `<span class="d">${diff>0?"↑":"↓"} ${FMT[n]?FMT[n](Math.abs(diff)):Math.abs(diff).toFixed(3)}</span>`; }
    return `<div class="knob" style="margin-bottom:10px">
      <div class="r"><span class="nm">${LABEL[n]||n}</span><span class="v">${FMT[n]?FMT[n](v):v.toFixed(3)}${d}</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join("");
}
function specRows(){
  const r = [
    ["peaking_boost","HF peaking", m=>m.peaking_boost, v=>v==null?"—":v.toFixed(2)+" dB"],
    ["power","Power", m=>m.power, v=>v==null?"—":(v*1e3).toFixed(2)+" mW"],
    ["eye_vertical_v","Eye height", m=>m.eye_vertical_v, v=>v==null?"—":v.toFixed(3)+" V"],
    ["eye_horizontal_ui","Eye width", m=>m.eye_horizontal_ui, v=>v==null?"—":v.toFixed(2)+" UI"],
  ];
  if (S.enforce_hd3) r.push(["hd3","HD3", m=>m.hd3_db, v=>v==null?"—":v.toFixed(1)+" dB"]);
  return r;
}
function renderSpecs(step){
  $("specs").innerHTML = specRows().map(([k,name,get,show]) => {
    const v = get(step.metrics);
    let viol = step.violations[k];
    if (k === "peaking_boost") viol = Math.max(step.violations.peaking_boost ?? 0, step.violations.peaking_ceiling ?? 0);
    const ok = viol != null && viol <= 0, pending = v == null;
    return `<div class="specrow"><span>${name}</span><span><span class="sv">${show(v)}</span>
      <span class="tag ${pending?"idle":ok?"ok":"bad"}">${pending?"not run":ok?"pass":"fail"}</span></span></div>`;
  }).join("");
  const vd = $("verdict");
  vd.classList.toggle("pass", step.all_specs_met);
  $("rewardVal").textContent = step.reward.toFixed(2);
  $("rewardSub").textContent = !step.all_specs_met ? "reward — specifications still missed"
    : step.step === firstOK ? `all specifications met at simulation ${firstOK}`
    : `feasible since simulation ${firstOK} — now growing margin`;
}
function drawEye(step){
  const c = ctxFor("eye"); if (!c) return; const [x,w,h] = c;
  const pad = {l:46,r:14,t:14,b:28}, traces = step.eye || [];
  if (!traces.length){ frame(x,w,h,pad); x.fillStyle="#C2453B"; x.font="13px system-ui";
    x.fillText("DC gate failed — nothing further simulated", pad.l+18, h/2);
    $("eyenote").innerHTML = `<span>the operating point did not converge — the AC, transient and HD3 gates were skipped</span>`; return; }
  let lo=Infinity, hi=-Infinity;
  for (const t of traces) for (const v of t){ if(v<lo)lo=v; if(v>hi)hi=v; }
  const span = Math.max(hi-lo,.05), mid=(hi+lo)/2; lo=mid-span*.62; hi=mid+span*.62;
  const X = u => pad.l + u/2*(w-pad.l-pad.r), Y = v => pad.t + (hi-v)/(hi-lo)*(h-pad.t-pad.b);
  const eh = S.eye_vertical_min_v, ew = S.eye_horizontal_min_ui;
  const cx = step.metrics.eye_center_ui != null ? step.metrics.eye_center_ui : .5;
  x.fillStyle="rgba(14,124,87,.08)"; x.strokeStyle="rgba(14,124,87,.45)"; x.setLineDash([4,3]);
  const bx=X(cx+.5-ew/2), bw=X(cx+.5+ew/2)-bx, by=Y(mid+eh/2), bh=Y(mid-eh/2)-by;
  x.fillRect(bx,by,bw,bh); x.strokeRect(bx,by,bw,bh); x.setLineDash([]);
  x.fillStyle="rgba(14,124,87,.85)"; x.font="10.5px system-ui"; x.fillText("required opening", bx+5, by-5);
  frame(x,w,h,pad);
  x.strokeStyle="rgba(26,111,232,.16)"; x.lineWidth=1;
  for (const t of traces){ x.beginPath();
    t.forEach((v,i)=>{ const u=i/(t.length-1)*2; i?x.lineTo(X(u),Y(v)):x.moveTo(X(u),Y(v)); }); x.stroke(); }
  x.fillStyle="#8494A8"; x.font="10.5px system-ui";
  for (const u of [0,.5,1,1.5,2]) x.fillText(u.toFixed(1), X(u)-7, h-11);
  for (let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; x.fillText(v.toFixed(2), 8, Y(v)+3); }
  x.fillText("unit intervals", w/2-30, h-1);
  const m = step.metrics, okH = m.eye_vertical_v>=eh, okW = m.eye_horizontal_ui>=ew;
  $("eyenote").innerHTML =
    `<span>eye height <b style="color:${okH?"var(--ok)":"var(--bad)"}">${m.eye_vertical_v.toFixed(3)} V</b> / ${eh} V</span>`+
    `<span>eye width <b style="color:${okW?"var(--ok)":"var(--bad)"}">${m.eye_horizontal_ui.toFixed(2)} UI</b> / ${ew} UI</span>`+
    `<span style="margin-left:auto">2 UI after the channel</span>`;
}
function drawAC(step){
  const c = ctxFor("ac"); if (!c) return; const [x,w,h] = c;
  const pad={l:34,r:12,t:12,b:20}, ac=step.ac||{f:[],g:[]};
  if (!ac.f.length){ frame(x,w,h,pad); return; }
  const f0=Math.log10(ac.f[0]), f1=Math.log10(ac.f[ac.f.length-1]);
  let lo=Math.min(...ac.g), hi=Math.max(...ac.g); const m=Math.max((hi-lo)*.2,.6); lo-=m; hi+=m;
  const X=f=>pad.l+(Math.log10(f)-f0)/(f1-f0)*(w-pad.l-pad.r), Y=g=>pad.t+(hi-g)/(hi-lo)*(h-pad.t-pad.b);
  frame(x,w,h,pad);
  const nyq=DATA.nyquist_ghz*1e9;
  x.strokeStyle="#C9D6E6"; x.setLineDash([4,3]); x.beginPath();
  x.moveTo(X(nyq),pad.t); x.lineTo(X(nyq),h-pad.b); x.stroke(); x.setLineDash([]);
  x.fillStyle="#8494A8"; x.font="9.5px system-ui"; x.fillText("Nyquist", X(nyq)+4, pad.t+10);
  x.strokeStyle="#1A6FE8"; x.lineWidth=1.8; x.beginPath();
  ac.f.forEach((f,i)=> i?x.lineTo(X(f),Y(ac.g[i])):x.moveTo(X(f),Y(ac.g[i]))); x.stroke();
  const pk=step.metrics.peaking_boost;
  if (pk!=null){ x.fillStyle="#0F1C2E"; x.font="11.5px system-ui"; x.fillText(pk.toFixed(2)+" dB peaking", pad.l+6, pad.t+11); }
}
function drawTraining(){
  const c = ctxFor("train"); if (!c) return; const [x,w,h] = c;
  const pad={l:34,r:12,t:12,b:20}, t=DATA.training||{};
  if (!t.step || !t.step.length){ frame(x,w,h,pad); return; }
  const s0=t.step[0], s1=t.step[t.step.length-1];
  const X=v=>pad.l+(v-s0)/Math.max(1,s1-s0)*(w-pad.l-pad.r), Y=v=>pad.t+(100-v)/100*(h-pad.t-pad.b);
  frame(x,w,h,pad);
  x.strokeStyle="#EDF1F7"; x.beginPath();
  for (const g of [25,50,75]){ x.moveTo(pad.l,Y(g)); x.lineTo(w-pad.r,Y(g)); } x.stroke();
  x.strokeStyle="#1A6FE8"; x.lineWidth=2; x.beginPath();
  t.step.forEach((v,i)=> i?x.lineTo(X(v),Y(t.feasible[i])):x.moveTo(X(v),Y(t.feasible[i]))); x.stroke();
  x.fillStyle="#8494A8"; x.font="10px system-ui";
  x.fillText("100%",6,Y(100)+9); x.fillText("0",6,Y(0)-2);
  x.fillText(s0+" steps",pad.l,h-7); x.fillText(s1+" steps",w-pad.r-52,h-7);
  const end=t.feasible[t.feasible.length-1];
  x.fillStyle="#0F1C2E"; x.font="11.5px system-ui";
  x.fillText(end.toFixed(0)+"% of steps meet every spec", pad.l+8, Math.max(Y(end)-9, pad.t+24));
}
function drawRace(){
  const c = ctxFor("race"); if (!c) return; const [x,w,h] = c;
  const pad={l:36,r:14,t:14,b:24};
  const rs = DATA.steps.map(s=>s.reward);
  const bases = Object.entries(B);
  const span = Math.max(DATA.steps.length, ...bases.map(([,b])=>b.reward.length));
  let lo=-3, hi=Math.max(...rs,22);
  for (const [,b] of bases) lo=Math.min(lo, Math.min(...b.reward));
  lo=Math.max(lo,-12);
  const X=i=>pad.l+i/Math.max(1,span-1)*(w-pad.l-pad.r), Y=r=>pad.t+(hi-Math.max(lo,r))/(hi-lo)*(h-pad.t-pad.b);
  frame(x,w,h,pad);
  x.strokeStyle="#EDF1F7"; x.beginPath(); x.moveTo(pad.l,Y(0)); x.lineTo(w-pad.r,Y(0)); x.stroke();
  const COL={"CMA-ES":"#E0A32E","random search":"#A9B7C9"};
  for (const [label,b] of bases){
    x.strokeStyle=COL[label]||"#A9B7C9"; x.lineWidth=1.3; x.globalAlpha=.75; x.beginPath();
    b.reward.forEach((r,i)=> i?x.lineTo(X(i),Y(r)):x.moveTo(X(i),Y(r))); x.stroke(); x.globalAlpha=1;
    if (b.first_feasible && b.first_feasible<=b.reward.length){ const i=b.first_feasible-1;
      x.fillStyle=COL[label]||"#A9B7C9"; x.beginPath(); x.arc(X(i),Y(b.reward[i]),3.5,0,7); x.fill(); }
  }
  x.strokeStyle="#1A6FE8"; x.lineWidth=2.4; x.beginPath();
  rs.forEach((r,i)=> i?x.lineTo(X(i),Y(r)):x.moveTo(X(i),Y(r))); x.stroke();
  rs.forEach((r,i)=>{ x.fillStyle = DATA.steps[i].all_specs_met?"#0E7C57":"#C2453B";
    x.beginPath(); x.arc(X(i),Y(r),4,0,7); x.fill(); });
  x.fillStyle="#8494A8"; x.font="10px system-ui";
  x.fillText("sim 1", pad.l, h-8); x.fillText("sim "+span, w-pad.r-34, h-8);
  x.fillText(hi.toFixed(0), 8, Y(hi)+9); x.fillText(lo.toFixed(0), 8, Y(lo)-2);
  const parts = [`<b style="color:#1A6FE8">━</b> policy · feasible at sim ${firstOK}`];
  for (const [label,b] of bases) parts.push(`<b style="color:${COL[label]||"#A9B7C9"}">━</b> ${label} · sim ${b.first_feasible||"—"}`);
  $("raceLegend").innerHTML = parts.join(" &nbsp;&nbsp; ");
}
function fillPVT(){
  if (!DATA.pvt || !$("pvtGrid")) return;
  $("pvtGrid").innerHTML = DATA.pvt.map(p=>`<i class="${p.pass?"ok":""}" title="${p.name}"></i>`).join("");
  $("pvtNote").textContent = `${DATA.pvt.filter(p=>p.pass).length}/${DATA.pvt.length} corners pass — 5 process × 3 supply × 3 temperature, peaking inside ${S.peaking_min_db}–${S.peaking_max_db} dB everywhere.`;
}
function fillNetlist(){
  if (!$("nlOut") || !DATA.netlist) return;
  const keep = DATA.netlist.split(NL).filter(l => l.trim()).slice(0, 14)
    .map(l => l.length > 56 ? l.slice(0, 55) + "…" : l);
  $("nlOut").textContent = keep.join(NL);
}

const VERB = {
  W_in:["widened the input pair","narrowed the input pair"],
  R_load:["raised the load resistance","lowered the load resistance"],
  I_bias:["raised the tail current","cut the tail current"],
  R_s:["increased degeneration","reduced degeneration"],
  C_s:["moved the zero down in frequency","moved the zero up in frequency"],
  dfe_tap:["strengthened the DFE tap","weakened the DFE tap"],
};
function moveCaption(step, prev){
  if (!prev) return `<b>Simulation 1 · a random starting design.</b> This is where the policy is dropped, `
    + `at a corner it is not told the name of.`;
  const moves = Object.keys(step.parameters).map(n => {
    const [lo,hi] = DATA.bounds[n] || [-0.5,0.5];
    return {n, f:(step.parameters[n]-prev.parameters[n])/(hi-lo)};
  }).filter(m => Math.abs(m.f) > 0.01).sort((a,b)=>Math.abs(b.f)-Math.abs(a.f)).slice(0,2);
  const said = moves.map(m => VERB[m.n] ? VERB[m.n][m.f>0?0:1] : m.n).join(" and ");
  const head = `<b>Simulation ${step.step}.</b> `;
  if (!said) return head + "The policy is holding the design it has.";
  if (step.all_specs_met && prev.all_specs_met)
    return head + `Already feasible — it ${said} to widen the margin, which is what the bonus term pays for.`;
  if (step.all_specs_met)
    return head + `It ${said}. Every specification now passes.`;
  return head + `It ${said}, following the violation gradient.`;
}

/* ---------------- navigation ---------------- */
let idx = 0, sim = 0, seen = new Set([0]);
const main = $("main"), liveIndex = SECTIONS.findIndex(s => s.live);

SECTIONS.forEach((s, i) => {
  const el = document.createElement("section");
  el.id = "sec-" + s.id; el.innerHTML = s.html; main.appendChild(el);
});
$("dots").innerHTML = SECTIONS.map((s,i)=>`<i class="dot" data-i="${i}"></i>`).join("");
$("dots").onclick = e => { const i = e.target.dataset.i; if (i != null) go(+i); };

function paint(){
  document.querySelectorAll("section").forEach((el,i)=> el.classList.toggle("on", i===idx));
  document.querySelectorAll(".dot").forEach((d,i)=>{ d.classList.toggle("on", i===idx); d.classList.toggle("seen", seen.has(i) && i!==idx); });
  $("bar").style.width = ((idx+1)/SECTIONS.length*100) + "%";
  $("count").textContent = String(idx+1).padStart(2,"0") + " / " + SECTIONS.length;
  $("back").disabled = idx === 0 && sim === 0;
  const s = SECTIONS[idx];
  if (s.live){
    renderLive();
    $("fwd").textContent = sim + 1 < DATA.steps.length ? "Run next simulation" : "Next";
  } else {
    $("fwd").textContent = idx === SECTIONS.length - 1 ? "Restart" : "Next";
  }
  if (s.id === "agent") drawTraining();
  if (s.id === "baselines") drawRace();
  if (s.id === "pvt") fillPVT();
  if (s.id === "deliverables") fillNetlist();
}
function renderLive(){
  const step = DATA.steps[sim], prev = sim ? DATA.steps[sim-1] : null;
  $("cornerName").textContent = DATA.corner;
  renderKnobs(step, prev); renderSpecs(step); drawEye(step); drawAC(step);
  $("miniTitle").textContent = "AC response · simulation " + (sim+1) + " of " + DATA.steps.length;
  $("movecap").innerHTML = moveCaption(step, prev);
}
function go(i, atEnd){
  const from = idx;
  idx = Math.max(0, Math.min(SECTIONS.length-1, i));
  seen.add(idx);
  if (idx !== from) sim = SECTIONS[idx].live ? (atEnd ? DATA.steps.length - 1 : 0) : 0;
  paint();
}
function fwd(){
  const s = SECTIONS[idx];
  if (s.live && sim + 1 < DATA.steps.length){ sim++; paint(); return; }
  if (idx === SECTIONS.length - 1){ seen = new Set([0]); go(0); return; }
  go(idx + 1);
}
function back(){
  const s = SECTIONS[idx];
  if (s.live && sim > 0){ sim--; paint(); return; }
  if (idx > 0) go(idx - 1, true);
}
$("fwd").onclick = fwd; $("back").onclick = back;
document.addEventListener("keydown", e => {
  if (e.code === "ArrowRight" || e.code === "Space" || e.code === "Enter"){ e.preventDefault(); fwd(); }
  if (e.code === "ArrowLeft"){ e.preventDefault(); back(); }
  if (e.code === "Home"){ go(0); }
  if (e.code === "End"){ go(SECTIONS.length - 1); }
});
window.addEventListener("resize", () => paint());

// #s=8 opens on section 8; &sim=3 opens the live section on simulation 3.
const HASH = new URLSearchParams(location.hash.slice(1));
if (HASH.has("s")){
  const byId = SECTIONS.findIndex(x => x.id === HASH.get("s"));
  idx = Math.max(0, Math.min(SECTIONS.length-1, byId >= 0 ? byId : (parseInt(HASH.get("s"),10)||1)-1));
  seen = new Set(Array.from({length: idx+1}, (_,k)=>k));
}
if (HASH.has("sim")) sim = Math.max(0, Math.min(DATA.steps.length-1, (parseInt(HASH.get("sim"),10)||1)-1));
paint();
</script>
